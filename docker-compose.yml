services:
  tracker:
    build: .
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - STATS_URL=http://stats:5000
    depends_on:
      - redis
      - stats

  stats:
    build: ./stats
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  redis:
    image: redis:7
